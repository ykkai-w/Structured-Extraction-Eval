[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-struct-eval"
version = "0.1.0"
description = "Evaluation toolkit for evidence-grounded structured extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kai"}]
keywords = ["llm", "evaluation", "information-extraction", "evidence", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
structeval = "structeval.cli:main"

[project.urls]
Repository = "https://github.com/ykkai-w/Structured-Extraction-Eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structeval = ["py.typed"]
